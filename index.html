<!DOCTYPE html>
<html lang="en-GB" dir="ltr">
<head>
<meta charset="utf-8"><meta name="MSRAI_Label_dbd012e0-e600-4c3e-83b7-7d3141c15efc_AI_Disclosure" content="Made with AI">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Race Round Olympus</title>
<style>
:root{--bg:#0c0a24;--panel:#1d1940;--panel2:#272154;--ink:#f7f0dc;--muted:#b9b0d8;--gold:#f2c14e;--gold2:#b8860b;--fire:#ff6b35;--love:#ff5d8f;--line:#4a3f7a;--serif:Georgia,"Palatino Linotype","Book Antiqua",serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--serif);color:var(--ink);min-height:100vh;background:
 radial-gradient(1px 1px at 10% 20%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 30% 70%,#fff7 50%,transparent 51%),radial-gradient(1.5px 1.5px at 55% 15%,#fffa 50%,transparent 51%),radial-gradient(1px 1px at 75% 45%,#fff8 50%,transparent 51%),radial-gradient(1.5px 1.5px at 90% 80%,#fff9 50%,transparent 51%),radial-gradient(1px 1px at 20% 90%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 65% 85%,#fff7 50%,transparent 51%),radial-gradient(1px 1px at 85% 10%,#fff8 50%,transparent 51%),
 radial-gradient(ellipse at 50% -10%,#4b2f8a 0%,#1c1550 40%,var(--bg) 75%);background-attachment:fixed}
header{text-align:center;padding:16px 10px 6px;display:flex;align-items:center;justify-content:center;gap:12px}
header svg{width:clamp(34px,6vw,60px);height:auto}
h1{margin:0;font-size:clamp(26px,4.6vw,48px);letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(180deg,#fff6cf,#f2c14e 45%,#a86f00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #3a2400)}
.sub{color:var(--muted);font-size:14px;text-align:center;font-style:italic}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:linear-gradient(180deg,#ffe08a,#f2c14e 50%,#c8901a);color:#2a1b00;font-weight:700;letter-spacing:.03em;box-shadow:0 3px 0 #7a5200,0 6px 14px #0006;transition:transform .1s}
button:hover:not(:disabled){transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #7a5200}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:#ffffff10;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.hidden{display:none !important}
.defs{position:absolute;width:0;height:0;overflow:hidden}
/* setup */
#setup{max-width:940px;margin:6px auto;padding:14px}
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 10px 30px #0005}
.card h2{margin:0 0 8px;font-size:15px;color:var(--gold);text-transform:uppercase;letter-spacing:.15em;text-align:center}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:14px 0}
.pick{background:#ffffff08;border:2px solid var(--line);border-radius:14px;padding:12px;text-align:center;position:relative;transition:transform .15s,border-color .15s,box-shadow .15s}
.pick .medal{width:92px;height:92px;cursor:pointer;margin:auto;filter:drop-shadow(0 6px 8px #000a);transition:transform .2s}
.pick .medal:hover{transform:rotate(-6deg) scale(1.06)}
.pick.on{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 0 22px #f2c14e55}
.pick .nm{font-weight:700;font-size:19px;margin-top:6px}
.pick .wd{color:var(--muted);font-size:13px;font-style:italic}
.pick .order{position:absolute;top:8px;inset-inline-start:10px;background:var(--gold);color:#2a1b00;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-weight:800}
.pick .row{display:flex;gap:6px;justify-content:center;margin-top:8px}
.pick .row button{padding:6px 10px;font-size:13px;box-shadow:none}
.seg{background:#3b3170;color:var(--ink)}
.seg.sel{background:var(--ink);color:#2a1b00}
.setupbar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
/* game */
#game{display:grid;grid-template-columns:minmax(300px,600px) minmax(280px,370px);gap:18px;justify-content:center;padding:8px 14px 30px}
@media (max-width:920px){#game{grid-template-columns:1fr}}
.frame{position:relative;padding:3.2%;border-radius:14px;background:linear-gradient(135deg,#f6e7b8,#c9a45a 40%,#f3dc98 60%,#a8802f);box-shadow:0 18px 50px #000c,inset 0 0 0 2px #fff6}
.frame>svg.key{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;border-radius:14px}
.grid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(6,1fr);aspect-ratio:3/4.2;gap:0;background:#2a2148;border:3px solid #6b4d12}
.cell{position:relative;border:1.5px solid #8a6a2a;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3% 3% 2%;text-align:center;
 background:radial-gradient(ellipse at 30% 20%,#ffffff 0%,#f1ece2 40%,#ddd4c4 100%)}
.cell::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#b9ad9a33 33%,transparent 36%,transparent 60%,#a8998233 62%,transparent 65%);pointer-events:none}
.cell .lbl{position:relative;z-index:1;font-size:clamp(8px,1.55vw,13px);font-weight:700;text-transform:uppercase;letter-spacing:.06em;line-height:1.05;color:#3b2a10}
.cell .ds{position:relative;z-index:1;font-size:clamp(7px,1.25vw,11px);font-style:italic;line-height:1.05;color:#4a3a20}
.cell .ic{position:absolute;inset:16% 18% 14%;display:flex;align-items:center;justify-content:center;opacity:.9}
.cell .ic svg{height:100%;width:auto;max-width:100%;filter:drop-shadow(0 2px 2px #0004)}
.cell.plain .ic{opacity:.22}
.cell.here{box-shadow:inset 0 0 0 3px #ffd54f,inset 0 0 22px #ffd54f;z-index:1}
.c-start{background:radial-gradient(ellipse at 50% 30%,#fffbe6,#cde7b0 70%,#9cc77a)}
.c-crow{background:radial-gradient(ellipse at 50% 20%,#ffe0b2,#ffab61 60%,#d9692a)}
.c-cupid{background:radial-gradient(ellipse at 50% 30%,#fff0f6,#ffb3cf 65%,#f07aa6)}
.c-gotohell{background:radial-gradient(ellipse at 50% 30%,#ff8a65,#b71c1c 65%,#4a0000)}
.c-gotohell .lbl,.c-gotohell .ds,.c-hell .lbl,.c-hell .ds{color:#fff3d6;text-shadow:0 1px 2px #000}
.c-heph{background:radial-gradient(ellipse at 50% 30%,#eceff1,#b0bec5 60%,#78909c)}
.c-hell{background:radial-gradient(ellipse at 50% 100%,#ff9100 0%,#d84315 30%,#5d0a0a 70%,#1a0000)}
.c-makemiss{background:radial-gradient(ellipse at 50% 30%,#e3f2fd,#90caf9 70%,#5c9fd6)}
.c-apollo{background:radial-gradient(ellipse at 50% 40%,#fffde7,#ffe082 55%,#ffb300)}
.c-backstart{background:radial-gradient(ellipse at 50% 30%,#fff8e1,#e8cfa0 65%,#c9a46a)}
.flick{transform-origin:50% 90%;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1)}to{transform:scale(1.05,.93)}}
.spin{transform-origin:50% 50%;animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.centre{grid-column:2;grid-row:2/6;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:4%;
 background:radial-gradient(ellipse at 50% 35%,#5b4aa6 0%,#2e2466 55%,#1a1442 100%);border:1.5px solid #8a6a2a;overflow:hidden}
.centre .temple{position:absolute;inset:auto 0 0 0;width:100%;opacity:.28;pointer-events:none}
.centre>*:not(.temple){position:relative;z-index:1}
.turnlbl{font-size:clamp(13px,2.3vw,20px);font-weight:700;color:#fff3cf;text-shadow:0 2px 4px #000}
.turnmedal{width:38%;max-width:96px;filter:drop-shadow(0 6px 10px #000a)}
.die{width:clamp(54px,10.5vw,82px);aspect-ratio:1;border-radius:18%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:11%;
 background:radial-gradient(circle at 30% 25%,#ffffff,#efe9dc 55%,#cfc6b2);box-shadow:inset -4px -5px 8px #0003,inset 3px 3px 6px #fff,0 6px 0 #8a7b5c,0 10px 18px #0008}
.die span{width:72%;height:72%;margin:auto;border-radius:50%}
.die span.p{background:radial-gradient(circle at 35% 35%,#ffe9a8,#c8901a 60%,#7a5200);box-shadow:inset 0 1px 2px #0006}
.die.rolling{animation:roll .35s linear infinite}
@keyframes roll{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(.85)}100%{transform:rotate(360deg) scale(1)}}
.die.land{animation:land .3s ease-out}
@keyframes land{0%{transform:scale(1.25)}100%{transform:scale(1)}}
#rollBtn{font-size:clamp(13px,2.1vw,17px)}
.hint{color:#d6cff5;font-size:12px;font-style:italic;min-height:1.2em}
.token{position:absolute;width:10%;aspect-ratio:1;transform:translate(-50%,-50%);transition:left .2s ease,top .2s ease;z-index:5;pointer-events:none}
.token>svg.medal{width:100%;height:100%;filter:drop-shadow(0 4px 3px #000b)}
.token.cur{z-index:7}
.token.cur>svg.medal{animation:bob .9s ease-in-out infinite;filter:drop-shadow(0 0 5px #ffd54f) drop-shadow(0 0 12px #ffd54f)}
.token.trapped>svg.medal{filter:drop-shadow(0 0 6px #ff3d00) drop-shadow(0 0 12px #d50000)}
.token .hat{position:absolute;left:50%;top:-46%;width:70%;transform:translateX(-50%) rotate(-12deg)}
.token .heart{position:absolute;right:-12%;bottom:-10%;width:42%}
.token.hop{animation:hop .2s ease-out}
@keyframes hop{50%{margin-top:-2.2%}}
@keyframes bob{50%{transform:translateY(-9%)}}
.pop{position:absolute;transform:translate(-50%,-50%);z-index:9;font-weight:800;font-size:clamp(14px,2.6vw,24px);pointer-events:none;text-shadow:0 2px 0 #000,0 0 8px #000;animation:pop 1.4s ease-out forwards;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-80%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}
.flash{position:fixed;inset:0;pointer-events:none;z-index:40;opacity:0}
.flash.white{background:#fff;animation:flashw .6s ease-out}
.flash.red{background:radial-gradient(ellipse at center,transparent 30%,#d50000cc 100%);animation:flashr 1.2s ease-out}
.flash.pink{background:radial-gradient(ellipse at center,transparent 30%,#ff5d8faa 100%);animation:flashr 1.2s ease-out}
@keyframes flashw{0%{opacity:.95}20%{opacity:.1}30%{opacity:.7}100%{opacity:0}}
@keyframes flashr{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.shake{animation:bshake .5s linear}
@keyframes bshake{20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,3px)}80%{transform:translate(3px,-1px)}}
.side{display:flex;flex-direction:column;gap:12px}
.prow{display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;padding:6px;border-radius:10px}
.prow.cur{background:#ffffff14;outline:1px solid var(--gold)}
.prow svg{width:42px;height:42px}
.prow .n{font-weight:700}
.prow .s{font-size:12px;color:var(--muted)}
.laps{display:flex;gap:2px}
.laps svg{width:18px;height:18px}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:8px;margin-inline-start:4px;background:#ffffff1c;font-weight:400}
.badge.fire{background:#ff6b3540;color:#ffb199}.badge.love{background:#ff5d8f40;color:#ffc1d4}
#log{max-height:300px;overflow:auto;font-size:13.5px;line-height:1.4;margin:0;padding:0;list-style:none}
#log li{padding:5px 2px;border-bottom:1px solid #ffffff12}
#log li:first-child{color:#fff;font-weight:600}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:#05031acc;display:grid;place-items:center;z-index:50;padding:16px}
.mbox{background:linear-gradient(180deg,#2d2560,#1b1640);border:2px solid var(--gold);border-radius:16px;padding:18px;max-width:540px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px #000;animation:min .25s ease-out}
@keyframes min{from{transform:scale(.9);opacity:0}}
.mbox h3{margin:0 0 6px;color:var(--gold);font-size:21px}
.mbox p{margin:6px 0 12px}
.mbox .opts{display:flex;flex-direction:column;gap:8px}
.mbox .opts button{display:flex;align-items:center;gap:10px;justify-content:center}
.mbox .opts svg{width:30px;height:30px}
.mhead{display:flex;align-items:center;gap:12px}
.mhead svg{width:58px;height:58px;flex:none}
.rules ul{padding-inline-start:0;margin:6px 0;list-style:none}
.rules li{margin:8px 0;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center}
.rules li svg{width:34px;height:34px}
.win{text-align:center}
.win svg.medal{width:150px;height:150px;animation:bob 1s ease-in-out infinite}
.confetti{position:fixed;top:-20px;width:12px;height:12px;z-index:60;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
</style>
</head>

function layout(n){
  if(n===1)return[[0,2.5]];
  if(n===2)return[[-6,2.5],[6,2.5]];
  if(n===3)return[[-10.5,2.5],[0,2.5],[10.5,2.5]];
  if(n===4)return[[-6,-1],[6,-1],[-6,5.5],[6,5.5]];
  const out=[];const rows=Math.ceil(n/3);for(let i=0;i<n;i++){const c=i%3,r=Math.floor(i/3);out.push([(c-1)*10.5,2.5+(r-(rows-1)/2)*(rows>2?4.2:6.5)]);}return out;
}

    });
  });
  SQ.forEach(s=>s.el.classList.remove('here'));
  const c=P[cur];
  if(!over) SQ[c.pos].el.classList.add('here');
  $('turnMedal').innerHTML=medal(c.god); $('turnLbl').textContent=over?'':`${c.name}'s turn`+(c.cpu?' (computer)':'');
  const pl=$('plist'); pl.innerHTML='';
  P.forEach((p,i)=>{
    const r=document.createElement('div'); r.className='prow'+(i===cur&&!over?' cur':'');
    let b='';
    if(p.inHell) b+='<span class="badge fire">In Hell</span>';
    if(p.skip) b+=`<span class="badge">misses ${p.skip}</span>`;
    if(p.bound) b+='<span class="badge love">with Aphrodite</span>';
    const sq=SQ[p.pos]; const where=sq.plain?sq.n:(sq.t==='gotohell'?'Hades says GO TO HELL':sq.t==='makemiss'?'Make someone miss a turn':sq.t==='backstart'?'Go back to the start':sq.n);
    r.innerHTML=`${medal(p.god)}<div><div class="n">${p.name}${p.cpu?' <span class="badge">CPU</span>':''}${b}</div><div class="s">On ${where}</div></div><div class="laps" title="Laps completed">${[0,1,2].map(k=>STAR(k<p.laps)).join('')}</div>`;
    pl.appendChild(r);
  });
}
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function showDie(n){$('die').innerHTML=[...Array(9)].map((_,i)=>`<span class="${PIPS[n].includes(i)?'p':''}"></span>`).join('');}
async function rollDie(){
  const d=$('die'); d.classList.remove('land'); d.classList.add('rolling'); SFX.dice();
  for(let i=0;i<9;i++){showDie(1+Math.floor(Math.random()*6));await sleep(70);}
  const v=1+Math.floor(Math.random()*6); showDie(v); d.classList.remove('rolling'); void d.offsetWidth; d.classList.add('land'); SFX.diceLand(); return v;
}
function popup(p,text,color){const [x,y]=[parseFloat(p.el.style.left),parseFloat(p.el.style.top)];const e=document.createElement('div');e.className='pop';e.textContent=text;e.style.color=color||'#ffe082';e.style.left=x+'%';e.style.top=(y-4)+'%';$('grid').appendChild(e);setTimeout(()=>e.remove(),1500);}
function flash(kind){const f=$('flash');f.className='flash';void f.offsetWidth;f.className='flash '+kind;}
function shake(){const f=$('frame');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');}

function stepOne(p,dir){
  if(dir>0){p.pos++; if(p.pos>=N){p.pos=0;p.laps++; if(p.laps<LAPS){log(`${nm(p)} passes Start: lap ${p.laps} complete! ⭐`);SFX.lap();setTimeout(()=>popup(p,'Lap '+p.laps+'!','#ffd54f'),50);}}}
  else {p.pos--; if(p.pos<0){ if(p.laps>0){p.laps--;p.pos=N-1;} else p.pos=0; }}
}
async function move(ps,n){
  const dir=Math.sign(n);
  for(let i=0;i<Math.abs(n);i++){ ps.forEach(p=>{stepOne(p,dir);p.el.classList.remove('hop');void p.el.offsetWidth;p.el.classList.add('hop');}); dir>0?SFX.step(i+ (ps[0].pos%4)):SFX.stepBack(i); render(); await sleep(250); }
}
function team(p){
  const a=byGod('aphrodite'); if(!a) return [];
  if(p===a) return P.filter(q=>q.bound&&!q.inHell);
  if(p.bound) return [a,...P.filter(q=>q.bound&&q!==p)].filter(q=>!q.inHell);
  return [];
}
const sameTeam=(a,b)=>team(a).includes(b);
function sendToHell(p){
  p.pos=HELL; p.inHell=true; SFX.hell(); flash('red'); shake();
  if(p.bound){p.bound=false; log(`Cupid's arrow falls out: ${nm(p)} is no longer with Aphrodite.`);}
  const a=byGod('aphrodite'); if(p===a && P.some(q=>q.bound)){P.forEach(q=>q.bound=false); log('Aphrodite is in Hell, so her Cupid team breaks up.');}
  render(); popup(p,'To Hell!','#ff7043');
}
function checkWin(prefer){
  const w=P.filter(p=>p.laps>=LAPS); if(!w.length) return false;
  const winner=w.includes(prefer)?prefer:w[0]; over=true; waitingHuman=false; render();
  log(`🏆 ${nm(winner)} has raced round Olympus three times and WINS!`); SFX.win(); flash('white');
  const box=$('mbox'); box.innerHTML=`<div class="win">${medal(winner.god)}<h3>${winner.name} wins!</h3><p>Three times round Olympus. Glory to ${winner.name}!</p><div class="opts"><button id="againBtn">Play again with the same gods</button><button class="ghost" id="setupBtn">Choose different gods</button></div></div>`;
  $('modal').classList.remove('hidden');
  $('againBtn').addEventListener('click',()=>{closeModal();startGame();});
  $('setupBtn').addEventListener('click',()=>{closeModal();P=[];$('game').classList.add('hidden');$('setup').classList.remove('hidden');});
  const cols=['#ffd54f','#ff5d8f','#4fc3f7','#9ccc65','#fff','#b388ff'];
  for(let i=0;i<80;i++){const c=document.createElement('div');c.className='confetti';c.style.background=cols[i%cols.length];c.style.borderRadius=i%2?'50%':'2px';c.style.left=Math.random()*100+'vw';c.style.animationDuration=(2+Math.random()*3)+'s';c.style.animationDelay=Math.random()*1.5+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),6500);}
  return true;
}
function closeModal(){$('modal').classList.add('hidden');}
function choose(decider,title,text,opts,cpuPick){
  return new Promise(async res=>{
    SFX.choose();
    if(decider.cpu){ await sleep(1000); const v=cpuPick(); const o=opts.find(o=>o.v===v); log(`${nm(decider)} (CPU) chooses: ${o.l}`); res(v); return; }
    const box=$('mbox');
    box.innerHTML=`<div class="mhead">${medal(decider.god)}<h3>${title}</h3></div><p>${text}</p><div class="opts"></div>`;
    const od=box.querySelector('.opts');
    opts.forEach(o=>{const b=document.createElement('button');b.innerHTML=(o.god?medal(o.god):'')+o.l;b.addEventListener('click',()=>{closeModal();SFX.click();log(`${nm(decider)} chooses: ${o.l}`);res(o.v);});od.appendChild(b);});
    $('modal').classList.remove('hidden');
  });
}
function showRules(){
  const ic=a=>`<svg viewBox="0 0 100 100" aria-hidden="true">${ART[a]}</svg>`;
  const box=$('mbox'); box.innerHTML=`<div class="rules"><h3>The rules</h3><ul>
   <li>${ic('start')}<span><b>To win</b> you must go around the board <b>3 times</b>.</span></li>
   <li>${medal('ares')}<span>If you land on the same space as someone, <b>they move back 2</b>.</span></li>
   <li>${medal('zeus')}<span>If you are not <b>Zeus</b> and Zeus lands on you, you <b>move forward 2</b>. But if you land on Zeus, <b>you move back 4</b>.</span></li>
   <li>${medal('hades')}<span>If you land on <b>Hades</b>, Hades chooses whether you move forward 1 more or go to Hell.</span></li>
   <li>${ic('hell')}<span>If you are <b>sent to Hell</b>, you can only escape on your turn by rolling a <b>6</b> (then roll again). If you just land on Hell you are <b>just visiting</b>. Wear the hat!</span></li>
   <li>${ic('cupid')}<span><b>Cupid:</b> fly to Aphrodite's square. You are now a team: when one rolls forward, the other goes too. <b>Hephaestus</b> sets you free.</span></li>
   <li>${ic('crow')}<span><b>Crowed!</b> The person playing Crow can swap places with you (but doesn't have to).</span></li>
   <li>${ic('gotohell')}<span><b>Hades says GO TO HELL!</b> Off you go.</span></li>
   <li>${ic('apollo')}<span><b>Apollo's blinding Sun:</b> miss a turn.</span></li>
   <li>${ic('makemiss')}<span><b>Make someone else miss a turn:</b> you pick who.</span></li>
   <li>${ic('backstart')}<span><b>Go back to the start</b> (laps already done still count).</span></li>
  </ul></div>`;
  const b=document.createElement('button'); b.textContent='Got it'; b.style.marginTop='10px'; b.addEventListener('click',()=>{SFX.click();closeModal();}); box.appendChild(b);
  $('modal').classList.remove('hidden');
}

function startTurn(){
  if(over||!P.length) return;
  const p=P[cur]; render();
  if(p.skip>0){ p.skip--; log(`${nm(p)} misses this turn.`); SFX.miss(); popup(p,'Miss a turn','#90caf9'); busy=true; const g=P; setTimeout(()=>{ if(g!==P) return; busy=false; next();},1000*speed); return; }
  $('hint').textContent=p.inHell?'In Hell: roll a 6 to escape!':(p.cpu?'The computer is rolling…':'or press Space');
  if(p.cpu){ waitingHuman=false; $('rollBtn').disabled=true; const g=P; setTimeout(()=>{ if(!over && g===P && P[cur]===p) doRoll(); },850*speed); }
  else { waitingHuman=true; $('rollBtn').disabled=false; }
}
function humanRoll(){ if(busy||over) return; waitingHuman=false; $('rollBtn').disabled=true; doRoll(); }
function next(){ if(over) return; cur=(cur+1)%P.length; startTurn(); }

async function doRoll(){
  if(busy||over) return; busy=true;
  const p=P[cur]; const g=P;
  const r=await rollDie(); if(over||g!==P) return;
  log(`${nm(p)} rolls a <b>${r}</b>.`);
  await sleep(250);
  let again=false;
  if(p.inHell){
    if(r===6){ p.inHell=false; SFX.escape(); popup(p,'Escaped!','#a5d6a7'); log(`${nm(p)} escapes from Hell! Roll again.`); again=true; }
    else { SFX.growl(); log(`${nm(p)} is stuck in Hell.`); }
  } else {
    const mates=team(p);
    if(mates.length) log(`💘 ${mates.map(nm).join(' and ')} ${mates.length>1?'fly':'flies'} along with ${nm(p)}.`);
    await move([p,...mates],r);
    if(over||g!==P) return;
    if(checkWin(p)) return;
    await land(p);
    if(over||g!==P) return;
    if(checkWin(p)) return;
  }
  render(); busy=false;
  if(again) startTurn(); else next();
}

async function land(p){
  if(p.pos!==HELL){
    const others=P.filter(q=>q!==p&&q.pos===p.pos&&!q.inHell&&!sameTeam(p,q));
    if(others.length){
      const zeus=others.find(q=>q.god==='zeus'), hades=others.find(q=>q.god==='hades');
      if(p.god==='zeus'){
        SFX.thunder(); flash('white'); shake();
        for(const q of others){ log(`⚡ Zeus lands on ${nm(q)}: ${nm(q)} moves forward 2!`); popup(q,'+2','#fff59d'); await sleep(500); await move([q],2); }
      } else if(zeus){
        SFX.thunder(); flash('white'); shake(); popup(p,'−4','#ff8a80');
        log(`⚡ ${nm(p)} landed on Zeus: move back 4!`); await sleep(600); await move([p],-4);
        for(const q of others.filter(q=>q!==zeus)){ log(`${nm(q)} gets bumped back 2.`); SFX.bump(); popup(q,'−2','#ff8a80'); await move([q],-2); }
      } else if(hades && p.god!=='hades'){
        const ch=await choose(hades,'Hades decides…',`${p.name} landed on you. Do they move forward 1 more, or go to Hell?`,
          [{l:'Move forward 1',v:'fwd'},{l:'Go to Hell!',v:'hell'}], ()=>Math.random()<0.75?'hell':'fwd');
        if(over) return;
        for(const q of others.filter(q=>q!==hades)){ log(`${nm(q)} gets bumped back 2.`); SFX.bump(); popup(q,'−2','#ff8a80'); await move([q],-2); }
        if(ch==='hell'){ log(`🔥 ${nm(p)} is sent to Hell by Hades!`); sendToHell(p); return; }
        SFX.forward(); popup(p,'+1','#a5d6a7'); await move([p],1);
      } else {
        for(const q of others){ log(`${nm(p)} lands on ${nm(q)}: ${nm(q)} moves back 2.`); SFX.bump(); shake(); popup(q,'−2','#ff8a80'); await sleep(300); await move([q],-2); }
      }
    }
  }
  if(over) return;
  const s=SQ[p.pos];
  switch(s.t){
    case 'crow':{
      SFX.caw();
      const c=byGod('crow');
      if(!c){log('Crowed! But no-one is playing Crow.');break;}
      if(c===p){log('Crow lands on her own square. Caw!');break;}
      if(c.inHell){log('Crowed! But Crow is stuck in Hell.');break;}
      const ch=await choose(c,'Crowed!',`${p.name} landed on the Crow square. Swap places with them? (You don't have to.)`,
        [{l:`Swap with ${p.name}`,v:'swap',god:p.god},{l:'Stay where I am',v:'stay'}], ()=>c.pos<p.pos?'swap':'stay');
      if(over) return;
      if(ch==='swap'){ const t=c.pos; c.pos=p.pos; p.pos=t; SFX.swap(); log(`Crow swaps places with ${nm(p)}!`); render(); popup(c,'Swap!','#ffcc80'); }
      break;}
    case 'cupid':{
      const a=byGod('aphrodite');
      if(!a){log("Cupid! But Aphrodite isn't playing.");break;}
      if(a===p){SFX.cupid();log('Aphrodite visits Cupid.');break;}
      if(a.inHell){log('Cupid! But Aphrodite is in Hell, so nothing happens.');break;}
      SFX.cupid(); flash('pink'); await sleep(350); p.pos=a.pos; p.bound=true;
      log(`💘 Cupid! ${nm(p)} flies to Aphrodite: they are now a team!`); render(); popup(p,'💘','#ff80ab');
      break;}
    case 'gotohell': log(`🔥 Hades says GO TO HELL! ${nm(p)} is sent to Hell.`); await sleep(200); sendToHell(p); break;
    case 'heph':
      SFX.anvil();
      if(p.bound){p.bound=false; log(`🔨 Hephaestus sets ${nm(p)} FREE from Aphrodite!`); popup(p,'Free!','#b0bec5'); render();}
      else log(`${nm(p)} visits Hephaestus's forge. Clang!`);
      break;
    case 'hell': SFX.growl(); log(`${nm(p)} is just visiting Hell. Wear the hat! 🎩`); break;
    case 'makemiss':{
      const opts=P.filter(q=>q!==p);
      const ch=await choose(p,'Make someone miss a turn','Who should miss their next turn?',
        opts.map(q=>({l:q.name,v:q.god,god:q.god})), ()=>opts.slice().sort((a,b)=>prog(b)-prog(a))[0].god);
      if(over) return;
      const t=byGod(ch); t.skip++; SFX.miss(); popup(t,'Zzz','#90caf9'); log(`${nm(t)} will miss a turn.`);
      break;}
    case 'apollo': p.skip++; SFX.sun(); flash('white'); popup(p,'Blinded!','#ffe082'); log(`☀️ Apollo's blinding Sun! ${nm(p)} misses a turn.`); break;
    case 'backstart': SFX.whoosh(); log(`↩️ ${nm(p)} goes back to the Start.`); popup(p,'Back to Start','#ffcc80'); await sleep(350); p.pos=0; render(); break;
    case 'start': SFX.forward(); break;
  }
}
drawPicks();
})();
</script>
